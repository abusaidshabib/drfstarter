services:
  django:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: drfstarter_production_django
    container_name: drfstarter_production_django
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./static:/app/static # Mount static files for serving
      - ./media:/app/media # Mount media files
    env_file:
      - .env.prod # Load environment variables from .env.prod
    environment:
      - DJANGO_ENV=production
      - pb=${pb:-default_value}
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    ports:
      - "5000:8000"
    command: /start
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16.4-alpine3.20
    container_name: drfstarter_production_postgres
    volumes:
      - drfstarter_production_postgres_data:/var/lib/postgresql/data
      - drfstarter_production_postgres_data_backups:/backups
    env_file:
      - .env.prod # Use .env.prod to pass in the environment variables
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} # Directly use the POSTGRES_PASSWORD from .env.prod
      - POSTGRES_USER=${POSTGRES_USER} # Use the POSTGRES_USER from .env.prod
      - POSTGRES_DB=${POSTGRES_DB} # Use the POSTGRES_DB from .env.prod
      - POSTGRES_HOST=${POSTGRES_HOST} # Use the POSTGRES_HOST from .env.prod
      - POSTGRES_PORT=${POSTGRES_PORT} # Use the POSTGRES_PORT from .env.prod
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8.0-alpine
    container_name: drfstarter_production_redis
    volumes:
      - drfstarter_production_redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} # Correctly pass password from env var
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD} # Ensure Redis password is passed correctly
    env_file:
      - .env.prod # Make sure the .env.prod file is loaded
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"] # Correctly pass password to the healthcheck
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  drfstarter_production_postgres_data:
  drfstarter_production_postgres_data_backups:
  drfstarter_production_redis_data:
